# Optional GPU smoke (self-hosted runner with NVIDIA GPU + zerollama serve).
# Not run on every PR — workflow_dispatch only.
#
# Prerequisites on the runner:
#   - Labels: self-hosted, gpu
#   - For gpu_smoke_all: zerollama serve on :8080 / :8081
#   - For phase17/edge smokes: LLAMA_SERVER_BIN + pulled model tag (self-contained serve)
#   - Repo variables: GPU_SMOKE_LLAMA_MODEL, GPU_SMOKE_LLAMA_SERVER_BIN, GPU_SMOKE_GGUF, GPU_SMOKE_PROXY_MODEL
#   - For run_clamp: serve started with ZEROLLAMA_RUNTIME_VRAM_CLAMP_NUM_CTX=auto
name: zerollama-gpu-smoke

on:
  workflow_dispatch:
    inputs:
      run_tools:
        description: 'RUN_E2E_TOOLS=1'
        type: boolean
        default: true
      run_legacy:
        description: 'RUN_E2E_LEGACY=1'
        type: boolean
        default: false
      run_clamp:
        description: 'Requires serve with VRAM_CLAMP_NUM_CTX=auto'
        type: boolean
        default: false
      run_p17:
        description: 'Phase 17 Go→llama-server smoke (self-contained; needs pulled tag)'
        type: boolean
        default: false
      run_edge:
        description: 'Phase 16 edge smoke (serve --edge, runtime off)'
        type: boolean
        default: false
      run_p17_linux_auto:
        description: 'Phase 17 Linux auto smoke (plain serve, backend.llama_server=auto)'
        type: boolean
        default: false
      run_upstream_gguf:
        description: 'Bundle P17 + P17_LINUX_AUTO + EDGE (RUN_E2E_UPSTREAM_GGUF=1)'
        type: boolean
        default: false
      run_p17_vision:
        description: 'Phase 17 vision llama-server smoke (heavy; needs projector tag)'
        type: boolean
        default: false

jobs:
  gpu-smoke:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Phase 12 preflight
        if: inputs.run_tools || inputs.run_legacy || inputs.run_clamp
        run: ./scripts/phase/phase12_golden_ci.sh

      - name: GPU smoke (coordination + runtime + proxy)
        if: inputs.run_tools || inputs.run_legacy || inputs.run_clamp
        env:
          OLLAMA_HOST: http://127.0.0.1:8080
          ZEROLLAMA_RUNTIME_URL: http://127.0.0.1:8081
          LLAMA_MODEL: ${{ vars.GPU_SMOKE_LLAMA_MODEL }}
          LLAMA_SERVER_BIN: ${{ vars.GPU_SMOKE_LLAMA_SERVER_BIN }}
          RUN_E2E_GGUF: ${{ vars.GPU_SMOKE_GGUF }}
          RUN_E2E_PROXY_MODEL: ${{ vars.GPU_SMOKE_PROXY_MODEL }}
          RUN_E2E_TOOLS: ${{ inputs.run_tools == true && '1' || '0' }}
          RUN_E2E_LEGACY: ${{ inputs.run_legacy == true && '1' || '0' }}
          RUN_E2E_PHASE13_SNAPSHOT: '1'
        run: ./scripts/gpu/gpu_smoke_all.sh

      - name: VRAM clamp smoke
        if: inputs.run_clamp
        env:
          OLLAMA_HOST: http://127.0.0.1:8080
          ZEROLLAMA_RUNTIME_URL: http://127.0.0.1:8081
          LLAMA_MODEL: ${{ vars.GPU_SMOKE_LLAMA_MODEL }}
          LLAMA_SERVER_BIN: ${{ vars.GPU_SMOKE_LLAMA_SERVER_BIN }}
          RUN_E2E_GGUF: ${{ vars.GPU_SMOKE_GGUF }}
        run: ./scripts/gpu/gpu_clamp_smoke.sh

      - name: Phase 17 llama-server smoke
        if: inputs.run_p17
        env:
          LLAMA_MODEL: ${{ vars.GPU_SMOKE_LLAMA_MODEL }}
          LLAMA_SERVER_BIN: ${{ vars.GPU_SMOKE_LLAMA_SERVER_BIN }}
          RUN_E2E_GGUF: ${{ vars.GPU_SMOKE_GGUF }}
          P17_MODEL: ${{ vars.GPU_SMOKE_PROXY_MODEL }}
        run: ./scripts/phase/phase17_llama_server_smoke.sh

      - name: Phase 16 edge smoke
        if: inputs.run_edge
        env:
          LLAMA_MODEL: ${{ vars.GPU_SMOKE_LLAMA_MODEL }}
          LLAMA_SERVER_BIN: ${{ vars.GPU_SMOKE_LLAMA_SERVER_BIN }}
          RUN_E2E_GGUF: ${{ vars.GPU_SMOKE_GGUF }}
          P16_MODEL: ${{ vars.GPU_SMOKE_PROXY_MODEL }}
        run: ./scripts/phase/phase16_edge_smoke.sh

      - name: Phase 17 Linux auto smoke
        if: inputs.run_p17_linux_auto
        env:
          LLAMA_MODEL: ${{ vars.GPU_SMOKE_LLAMA_MODEL }}
          LLAMA_SERVER_BIN: ${{ vars.GPU_SMOKE_LLAMA_SERVER_BIN }}
          RUN_E2E_GGUF: ${{ vars.GPU_SMOKE_GGUF }}
          P17_MODEL: ${{ vars.GPU_SMOKE_PROXY_MODEL }}
        run: ./scripts/phase/phase17_linux_auto_smoke.sh

      - name: Upstream GGUF bundle (5080 session legs)
        if: inputs.run_upstream_gguf
        env:
          LLAMA_MODEL: ${{ vars.GPU_SMOKE_LLAMA_MODEL }}
          LLAMA_SERVER_BIN: ${{ vars.GPU_SMOKE_LLAMA_SERVER_BIN }}
          RUN_E2E_GGUF: ${{ vars.GPU_SMOKE_GGUF }}
          RUN_E2E_PROXY_MODEL: ${{ vars.GPU_SMOKE_PROXY_MODEL }}
          RUN_E2E_PREFLIGHT: '0'
          RUN_E2E_UPSTREAM_GGUF: '1'
        run: ./scripts/gpu/gpu_5080_session.sh

      - name: Phase 17 vision smoke
        if: inputs.run_p17_vision
        env:
          LLAMA_MODEL: ${{ vars.GPU_SMOKE_LLAMA_MODEL }}
          LLAMA_SERVER_BIN: ${{ vars.GPU_SMOKE_LLAMA_SERVER_BIN }}
          RUN_E2E_GGUF: ${{ vars.GPU_SMOKE_GGUF }}
          RUN_E2E_P17_VISION: '1'
          P17_VISION_MODEL: ${{ vars.GPU_SMOKE_VISION_MODEL }}
        run: ./scripts/phase/phase17_llama_server_vision_smoke.sh
