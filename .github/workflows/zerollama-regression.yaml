# Phase 10 regression gate: fast Go server/envconfig + Python runtime unit tests.
name: zerollama-regression

on:
  pull_request:
    paths:
      - 'server/**'
      - 'envconfig/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'x/trainingworker/**'
      - '.github/workflows/zerollama-regression.yaml'
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - 'envconfig/**'
      - 'runtime/**'
      - 'scripts/**'
      - 'x/trainingworker/**'
      - '.github/workflows/zerollama-regression.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install build deps (embedded training / pyembed)
        run: sudo apt-get update && sudo apt-get install -y python3-dev pkg-config
      - name: go test (server + envconfig; includes Phase 12 -run Golden)
        env:
          CGO_ENABLED: '1'
          OLLAMA_NO_CLOUD: 'true'
        run: go test -count=1 ./server/... ./envconfig/... ./x/trainingworker/...

  runtime-pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: runtime/pyproject.toml
      - name: Install runtime + test deps
        run: |
          python -m pip install -U pip
          pip install -e ".[serve]" pytest httpx
      - name: Build Phase 15 native KV extension
        run: python setup.py build_ext --inplace
      - name: pytest (includes test_go_render_chat.py / Phase 12 tools meta)
        env:
          PYTHONPATH: .
        run: python -m pytest tests/ -q --ignore=tests/test_supervisor.py
      - name: Check GPU operator scripts
        working-directory: ${{ github.workspace }}
        run: ./scripts/check_gpu_scripts.sh
