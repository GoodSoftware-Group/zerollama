# Drop-in for zerollama.service (Piper TTS + Whisper STT + remote-tts).
# Assets: /mnt/ollama_img/speech (see scripts/install_speech_backends.sh)
# Install: sudo cp scripts/systemd/speech-backends.conf /etc/systemd/system/zerollama.service.d/

[Service]
Environment="OLLAMA_PIPER_BIN=/mnt/ollama_img/speech/piper/piper"
Environment="OLLAMA_WHISPER_BIN=/mnt/ollama_img/speech/whisper/whisper-run"
Environment="OLLAMA_WHISPER_MODEL=/mnt/ollama_img/speech/whisper/ggml-base.en.bin"
Environment="OLLAMA_PIPER_TIMEOUT=5m"
Environment="OLLAMA_WHISPER_TIMEOUT=10m"
# Point at cozmic (or local) OpenAI-compatible TTS sidecar when using remote-tts tags:
Environment="OLLAMA_TTS_URL=http://127.0.0.1:8090"
Environment="OLLAMA_TTS_TIMEOUT=5m"
