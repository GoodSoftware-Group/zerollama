# Minimal dual-4090 drop-in for ollama.service.
# Topology + serve defaults live in runtime/configs/dual_4090.yaml (ZEROLLAMA_AUTO_CONFIG=1).
# Install: sudo cp scripts/systemd/dual_4090-ollama.conf /etc/systemd/system/ollama.service.d/dual_4090.conf

[Unit]
After=zerollama-runtime.service
Requires=zerollama-runtime.service
RequiresMountsFor=/mnt/ollama_img

[Service]
Environment="OLLAMA_HOST=0.0.0.0:2083"
Environment="OLLAMA_MODELS=/mnt/ollama_img/models"
Environment="OLLAMA_ORIGINS=*"
Environment="OLLAMA_LOAD_TIMEOUT=30m"
Environment="OLLAMA_LLM_LIBRARY=cuda_v12"
Environment="OLLAMA_LIBRARY_PATH=/opt/zerollama/llama-server-5f55650a:/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v12"
Environment="LD_LIBRARY_PATH=/opt/zerollama/llama-server-5f55650a:/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v12"
# Pin ggml-org 5f55650a (b10199+1): rebased quilt; keep f95de977 tree as rollback.
Environment="LLAMA_SERVER_BIN=/opt/zerollama/llama-server-5f55650a/llama-server"
Environment="ZEROLLAMA_AUTO_CONFIG=1"
Environment="ZEROLLAMA_RUNTIME_CONFIG=/opt/zerollama/runtime/configs/dual_4090.yaml"
Environment="ZEROLLAMA_REPO=/opt/zerollama"
Environment="ZEROLLAMA_RUNTIME=1"
Environment="ZEROLLAMA_RUNTIME_URL=http://127.0.0.1:8081"
Environment="ZEROLLAMA_RUNTIME_EMBED=0"
Environment="ZEROLLAMA_LLAMA_SERVER=1"
Environment="ZEROLLAMA_LEGACY_RUNNER=0"
Environment="ZEROLLAMA_EDGE=0"
Environment="OLLAMA_SCHED_SPREAD=1"
# 2026-07-30 MTP long-context hotfix: llama-server's cross-request LRU
# prompt cache (server_prompt_cache, PR #16391) checkpoints/restores the
# MTP draft context KV state independently from the target context. On
# long multi-turn chats this desyncs the NextN draft layer from the
# target model: draft acceptance collapses to ~0% and generation
# degenerates into multilingual token salad (qwen3.6 draft-mtp, ~27k ctx,
# ChainBuilder incident). Disabling the LRU prompt cache entirely avoids
# the buggy save/restore path; per-slot cache_prompt/n_cache_reuse (KV
# shifting within one slot/session) is unaffected. See llm/llama_server.go
# appendMTPDraftArgs for the intended permanent fix (blocked on an
# unrelated pre-existing cgo build break: C.mtmd_bitmap_set_grid_hint
# undeclared in vendored mtmd.h, commit 77924bf8a) — rebuild once that's
# resolved and drop this env var in favor of the MTP-only Go-side flag.
Environment="LLAMA_ARG_CACHE_RAM=0"
Restart=on-failure
RestartSec=2
