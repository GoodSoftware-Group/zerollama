# Minimal dual-4090 drop-in for ollama.service.
# Topology + serve defaults live in runtime/configs/dual_4090.yaml (ZEROLLAMA_AUTO_CONFIG=1).
# Install: sudo cp scripts/systemd/dual_4090-ollama.conf /etc/systemd/system/ollama.service.d/dual_4090.conf

[Unit]
After=zerollama-runtime.service
Requires=zerollama-runtime.service
RequiresMountsFor=/mnt/ollama_img

[Service]
Environment="OLLAMA_HOST=0.0.0.0:2083"
Environment="OLLAMA_MODELS=/mnt/ollama_img/models"
Environment="OLLAMA_ORIGINS=*"
Environment="OLLAMA_LOAD_TIMEOUT=30m"
Environment="OLLAMA_LLM_LIBRARY=cuda_v12"
Environment="OLLAMA_LIBRARY_PATH=/opt/zerollama/llama-server-f95de977:/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v12"
Environment="LD_LIBRARY_PATH=/opt/zerollama/llama-server-f95de977:/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v12"
# Pin ggml-org f95de977 (b10159): older d719fda draft-mtp poisoned thinking; mmproj+MTP unsupported.
Environment="LLAMA_SERVER_BIN=/opt/zerollama/llama-server-f95de977/llama-server"
Environment="ZEROLLAMA_AUTO_CONFIG=1"
Environment="ZEROLLAMA_RUNTIME_CONFIG=/opt/zerollama/runtime/configs/dual_4090.yaml"
Environment="ZEROLLAMA_REPO=/opt/zerollama"
Environment="ZEROLLAMA_RUNTIME=1"
Environment="ZEROLLAMA_RUNTIME_URL=http://127.0.0.1:8081"
Environment="ZEROLLAMA_RUNTIME_EMBED=0"
Environment="ZEROLLAMA_LLAMA_SERVER=1"
Environment="ZEROLLAMA_LEGACY_RUNNER=0"
Environment="ZEROLLAMA_EDGE=0"
Environment="OLLAMA_SCHED_SPREAD=1"
Restart=on-failure
RestartSec=2
