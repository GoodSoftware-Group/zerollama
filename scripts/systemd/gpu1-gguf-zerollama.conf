# Drop-in for zerollama.service when GLM Flash (openai-remote / EXL3) owns CUDA0.
# Install:
#   sudo cp scripts/systemd/gpu1-gguf-zerollama.conf /etc/systemd/system/zerollama.service.d/gpu1-gguf.conf
#   sudo systemctl daemon-reload && sudo systemctl restart zerollama
#
# WHY: astra pins glm53 with CUDA_VISIBLE_DEVICES=0 (~22 GiB). GGUF llama-server
# otherwise tries CUDA0 first and OOMs; LLAMA_ARG_DEVICE routes loads to the free 4090.

[Service]
Environment="LLAMA_ARG_DEVICE=CUDA1"
