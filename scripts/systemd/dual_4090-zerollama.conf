# Drop-in for zerollama.service (not ollama.service).
# Topology + serve defaults live in runtime/configs/dual_4090.yaml (ZEROLLAMA_AUTO_CONFIG=1).
# Install: sudo cp scripts/systemd/dual_4090-zerollama.conf /etc/systemd/system/zerollama.service.d/dual_4090.conf

# Wants (not Requires): starting zerollama also starts the runtime, but
# stopping either unit leaves the other running.
[Unit]
After=zerollama-runtime.service
Wants=zerollama-runtime.service
RequiresMountsFor=/mnt/ollama_img

[Service]
Environment="OLLAMA_HOST=0.0.0.0:2083"
Environment="OLLAMA_MODELS=/mnt/ollama_img/models"
Environment="OLLAMA_ORIGINS=*"
Environment="OLLAMA_LOAD_TIMEOUT=30m"
Environment="OLLAMA_LLM_LIBRARY=cuda_v12"
Environment="OLLAMA_LIBRARY_PATH=/opt/zerollama/llama-server-b10615:/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v12"
Environment="LD_LIBRARY_PATH=/opt/zerollama/llama-server-b10615:/usr/local/lib/ollama:/usr/local/lib/ollama/cuda_v12"
# Pin vendor b10615 (MultiDecode / MD1 --multidecode). Rollback: llama-server-5f55650a.
# With GLM on CUDA0, also install gpu1-gguf-zerollama.conf (LLAMA_ARG_DEVICE=CUDA1).
Environment="LLAMA_SERVER_BIN=/opt/zerollama/llama-server-b10615/llama-server"
Environment="ZEROLLAMA_AUTO_CONFIG=1"
Environment="ZEROLLAMA_RUNTIME_CONFIG=/opt/zerollama/runtime/configs/dual_4090.yaml"
Environment="ZEROLLAMA_REPO=/opt/zerollama"
Environment="ZEROLLAMA_RUNTIME=1"
Environment="ZEROLLAMA_RUNTIME_URL=http://127.0.0.1:8081"
Environment="ZEROLLAMA_RUNTIME_EMBED=0"
Environment="ZEROLLAMA_LLAMA_SERVER=1"
Environment="ZEROLLAMA_LEGACY_RUNNER=0"
Environment="ZEROLLAMA_EDGE=0"
Environment="OLLAMA_SCHED_SPREAD=1"
Restart=on-failure
RestartSec=2
# Embedded GPU job worker (train + video/music run_script). OLLAMA_TRAINING is a deprecated alias.
Environment="ZEROLLAMA_GPU_JOBS=true"
Environment="OLLAMA_TRAINING_TCP=0"
