# Training venv parked on ssd2 (was /mnt/nvme until 9100 PRO became /).
# Install: sudo cp scripts/systemd/training-ssd2-zerollama.conf /etc/systemd/system/zerollama.service.d/training-nvme.conf
[Unit]
RequiresMountsFor=/mnt/ssd2

[Service]
Environment="TRAINING_UV_VENV=/mnt/ssd2/nvme/zerollama/.venv-training"
Environment="TRAINING_UV_SITE_PACKAGES=/mnt/ssd2/nvme/zerollama/.venv-training/lib64/python3.14/site-packages"
Environment="OLLAMA_TRAINING_PYTHONPATH=/root/zerollama"
