# Fallback upstream Ollama on this dual-4090 host.
# Isolated from zerollama.service (:2083). Do not point this unit at /usr/local/bin/zerollama.
#
# Install binary: extract ollama-linux-amd64.tar.zst into /opt/ollama
#   sudo mkdir -p /opt/ollama
#   curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | sudo tar --zstd -x -C /opt/ollama
#   sudo ln -sfn /opt/ollama/bin/ollama /usr/local/bin/ollama
#
# Install this drop-in:
#   sudo cp scripts/systemd/ollama-fallback.conf /etc/systemd/system/ollama.service.d/fallback.conf

[Unit]
After=network-online.target
RequiresMountsFor=/mnt/ollama_img

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_MODELS=/mnt/ollama_img/models"
Environment="OLLAMA_ORIGINS=*"
Environment="OLLAMA_LOAD_TIMEOUT=30m"
# Official runner libs live under the isolated prefix, not zerollama's /usr/local/lib/ollama.
Environment="OLLAMA_LIBRARY_PATH=/opt/ollama/lib/ollama"
Environment="LD_LIBRARY_PATH=/opt/ollama/lib/ollama"
Environment="OLLAMA_MAX_LOADED_MODELS=1"
Environment="OLLAMA_SCHED_SPREAD=1"
Restart=on-failure
RestartSec=2
