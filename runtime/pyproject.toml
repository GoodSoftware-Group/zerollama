[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zerollama-runtime"
version = "0.1.0"
description = "GGUF-first inference runtime with PagedAttention KV (zerollama)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
gpu = ["nvidia-ml-py>=12.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]
native = []  # builds runtime.kv._kv_native C extension (Phase 15)

[[tool.setuptools.ext-modules]]
name = "runtime.kv._kv_native"
sources = ["native/kv_block_pool.c"]

[project.scripts]
zerollama-runtime = "runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
