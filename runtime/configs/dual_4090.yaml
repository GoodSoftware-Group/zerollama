# Dual RTX 4090 topology (Phase 3). Env vars override at launch.
device_count: 2
tensor_parallel: 2
# Layer split across both GPUs (-sm layer -ts). Tensor split (-sm tensor) aborts
# params_fit on llama.cpp c84b302+; layer + -ts is the stable dual-4090 path.
split_mode: layer
# Equal weight/KV split across both GPUs (llama-server -ts)
tensor_split: [1, 1]
main_gpu: 0
llama_parallel_slots: 4
# Go daemon defaults (envconfig/hardware_lane.go) — only applied when OLLAMA_* unset.
serve:
  max_loaded_models: 1
  keep_alive: 5m
  num_parallel: 1
  # WHY stock: L1 q8_0 wins decode tok/s on measured CUDA gates. For long-ctx VRAM
  # headroom use dual_4090_vram.yaml or ZEROLLAMA_LLAMA_FORK=1 (defaults to TBQ/
  # FORK_PROFILE=vram). Explicit FORK_PROFILE=speed is QJL/Polar experimental.
  # Doc: docs/gpu-profiles-l2.md
  llama_fork: stock
vram:
  clamp_num_ctx: auto
  check_gpu_vram: 1
kv:
  block_size: 16
  num_blocks_per_device: 8192
speculative:
  # one plugin active per model: ngram | draft-simple | draft-eagle3 | dflash
  method: none
  # draft_model: /path/to/draft.gguf
