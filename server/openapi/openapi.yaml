openapi: 3.1.0
info:
  title: zerollama API
  version: 0.1.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  description: |
    Live OpenAPI for this zerollama server.

    Includes the native Ollama `/api/*` surface plus OpenAI-compatible
    `/v1/*` routes (chat, embeddings, images, audio speech/transcriptions,
    voice catalog, and video generation).

    Interactive docs: `GET /docs` · raw: `GET /openapi.yaml` · `GET /openapi.json`
servers:
  - url: http://localhost:11434
    description: This server (rewritten at serve time to the request host)
security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
  parameters:
    DigestParam:
      name: digest
      in: path
      required: true
      description: SHA256 digest identifier, prefixed with `sha256:`
      schema:
        type: string
  schemas:
    ModelOptions:
      type: object
      description: |
        Runtime + runner options for `/api/generate`, `/api/chat`, and `/v1/chat/completions`
        (OpenAI requests map these via `extra_body.options`). Agents juggling many models
        should treat every field here as optional per-request tuning — set only what a
        given model/hardware combo needs; omitted fields fall back to server/model defaults.

        Also accepts `prompt_cache_key` (string) for KV/session reuse, and a nested
        `zerollama` object (see [ZerollamaQoS](#/components/schemas/ZerollamaQoS)) for
        scheduling hints on this fleet. Unknown fields are ignored, not rejected.
      properties:
        # Sampling Options
        seed:
          type: integer
          description: Random seed used for reproducible outputs
        temperature:
          type: number
          format: float
          description: Controls randomness in generation (higher = more random)
        top_k:
          type: integer
          description: Limits next token selection to the K most likely
        top_p:
          type: number
          format: float
          description: Cumulative probability threshold for nucleus sampling
        min_p:
          type: number
          format: float
          description: Minimum probability threshold for token selection
        typical_p:
          type: number
          format: float
          description: Locally typical sampling threshold
        repeat_last_n:
          type: integer
          description: How many recent tokens to consider for the repeat penalty
        repeat_penalty:
          type: number
          format: float
          description: Penalty applied to repeated tokens (1.0 = disabled)
        presence_penalty:
          type: number
          format: float
          description: OpenAI-style penalty for tokens that already appeared
        frequency_penalty:
          type: number
          format: float
          description: OpenAI-style penalty scaled by token frequency so far
        num_keep:
          type: integer
          description: Tokens from the start of the prompt to always keep when context is truncated
        num_predict:
          type: integer
          description: Maximum number of tokens to generate (-1 = unlimited, model/context permitting)
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Stop sequences that will halt generation
        prompt_cache_key:
          type: string
          description: >
            Stable key for KV/prompt-cache reuse across requests in the same thread
            (OpenAI-compatible; also honored on native /api/* routes). Pair with
            zerollama.session_group when multiple agents/harnesses should share a branch.
        zerollama:
          $ref: "#/components/schemas/ZerollamaQoS"

        # Runner options (set when the model is loaded; changing these on an already-loaded
        # model may trigger a reload)
        num_ctx:
          type: integer
          description: Context window size in tokens for this load
        num_batch:
          type: integer
          description: Logical batch size for prompt processing
        num_gpu:
          type: integer
          description: Number of layers to offload to GPU (-1 = auto)
        main_gpu:
          type: integer
          description: Index of the primary GPU for multi-GPU hosts
        num_thread:
          type: integer
          description: CPU threads used for inference
        use_mmap:
          type: boolean
          description: Memory-map model weights instead of reading them fully into RAM
        kv_cache_type:
          type: string
          enum: [f16, q8_0, q4_0]
          description: >
            KV cache quantization for this load. Overrides the server default
            (`OLLAMA_KV_CACHE_TYPE`); useful when juggling several models with different
            VRAM budgets on the same host.
        ggml_clamp_num_ctx:
          type: boolean
          description: When true, lowers num_ctx to the largest value that fits in available VRAM instead of failing to load.
        ggml_auto_kv_quant:
          type: boolean
          description: When true, automatically downgrades KV cache type (f16 → q8_0 → q4_0) if the load would otherwise exceed memory.
        draft_num_predict:
          type: integer
          description: Max tokens the draft model may speculate ahead in one step
        spec_type:
          type: string
          enum: [ngram-simple, draft-mtp, draft-eagle3]
          description: Speculative decoding strategy for this load (llama-server backends only)
        spec_ngram_size_n:
          type: integer
          description: N-gram size N for ngram-simple speculative decoding
        spec_ngram_size_m:
          type: integer
          description: N-gram size M for ngram-simple speculative decoding
        spec_ngram_min_hits:
          type: integer
          description: Minimum n-gram hits before speculating (ngram-simple)
        moe_mode:
          type: string
          description: Flash-MoE streaming mode for MoE models with a sidecar expert store
        moe_sidecar:
          type: string
          description: Path to the Flash-MoE sidecar directory of streamed routed experts
        moe_slot_bank:
          type: integer
          description: Flash-MoE slot bank index
        moe_topk:
          type: integer
          description: Number of routed experts to keep resident per token (Flash-MoE)
        moe_prefetch_temporal:
          type: boolean
          description: Enable temporal prefetch of likely-next experts (Flash-MoE)
      additionalProperties: true
    ZerollamaQoS:
      type: object
      description: |
        Fleet-scheduling hints under `options.zerollama` (also readable via the OpenAI
        `extra_body.zerollama` shape). Advertised live on `GET /api/version` under
        `zerollama.qos.options.fields` — prefer that probe over this schema when they
        disagree. Lets many concurrent agents/models share one host without starving
        each other.
      properties:
        qos_class:
          type: string
          enum: [interactive, auxiliary, background]
          description: >
            Scheduling tier. interactive (aliases primary, foreground) holds the runner
            for live agent turns; auxiliary (alias aux) is subagent/side work; background
            (alias bg) is best-effort batch work that yields to the others.
        qos_priority:
          type: integer
          minimum: 0
          maximum: 100
          description: 0-100; class is inferred from this when qos_class is omitted (>=70 → interactive).
        fulfillment:
          type: string
          enum: [complete, benchmark]
          description: >
            Request-scoped guarantee above qos_class. complete (aliases guarantee,
            reliable) finishes without preemption/eviction while allowing other idle
            models; benchmark (aliases bench, speed, exclusive) takes exclusive GPU —
            unload peers, block other traffic, force-clear pins. Why separate from
            qos_class: class is fair-share priority; fulfillment is a hard contract.
        session_group:
          type: string
          description: Harness id (alias `harness`) for a shared prompt-cache branch across requests/agents.
        session_parent:
          type: string
          description: >
            Parent thread's prompt_cache_key. Spawns wait (`wait_parent`) while the
            parent key is inflight or in cooldown (multiplex-aware), and Radix prefers
            that donor on equal-length hash ties.
        project_id:
          type: string
          description: Client/harness id shown in `zerollama ps` (aliases client_id, project).
        project_name:
          type: string
          description: Human-readable label for `zerollama ps` (alias client_name).
        cache_scope:
          type: string
          enum: [auto, thread, shared]
          description: KV/prompt-cache branch scope for this request.
        cache_level:
          type: string
          enum: [auto, gpu, dram, disk]
          description: >
            KV retention tier. auto (default) keeps existing heuristics; gpu/dram forbid
            disk persist (gpu≈dram until spill exists); disk allows slot blobs when policy permits.
        cache_reset:
          type: boolean
          description: Force a miss under the same prompt_cache_key for this request only.
      additionalProperties: true
    ZerollamaVersionQoS:
      type: object
      description: >
        Live advertisement on GET /api/version → zerollama.qos (from server/mlx_qos.go
        zerollamaVersionQoS). Prefer this probe over static OpenAPI examples.
      properties:
        classes:
          type: array
          items:
            type: string
            enum: [interactive, auxiliary, background]
        fulfillment:
          type: array
          items:
            type: string
            enum: [complete, benchmark]
          description: Supported fulfillment modes for options.zerollama.fulfillment
        modalities:
          type: array
          items:
            type: string
            enum: [text, vision, video_understanding, image_generation, video_generation]
        options:
          type: object
          properties:
            path:
              type: string
              example: options.zerollama
            fields:
              type: object
              description: Per-field help strings clients may display
              additionalProperties:
                type: string
              properties:
                qos_class:
                  type: string
                qos_priority:
                  type: string
                fulfillment:
                  type: string
                session_group:
                  type: string
                session_parent:
                  type: string
                project_id:
                  type: string
                project_name:
                  type: string
                cache_scope:
                  type: string
            legacy:
              type: array
              items:
                type: string
              description: Deprecated option keys still accepted
        openai:
          type: object
          properties:
            extra_body:
              type: array
              items:
                type: string
        routes:
          type: object
          additionalProperties:
            type: string
          description: Modality → HTTP route map
        defaults:
          type: object
          additionalProperties:
            type: string
          description: >
            Default qos_class by modality (vision/video_understanding are stream-aware).
          properties:
            image_generation:
              type: string
            video_generation:
              type: string
            vision:
              type: string
            video_understanding:
              type: string
      additionalProperties: true
    GenerateRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: Model name
        prompt:
          type: string
          description: Text for the model to generate a response from
        suffix:
          type: string
          description: Used for fill-in-the-middle models, text that appears after the user prompt and before the model response
        images:
          type: array
          items:
            type: string
            description: Base64-encoded images for models that support image input
        format:
          description: >
            Structured output. Accepts `"json"`, a JSON Schema object, or
            `{"type":"gbnf","grammar":"root ::= ..."}` (M15f). tools + format → 400 on chat.
          oneOf:
            - type: string
            - type: object
        system:
          description: System prompt for the model to generate a response from
          type: string
        stream:
          description: When true, returns a stream of partial responses
          type: boolean
          default: true
        think:
          oneOf:
            - type: boolean
            - type: string
              enum: [high, medium, low]
          description: When true, returns separate thinking output in addition to content. Can be a boolean (true/false) or a string ("high", "medium", "low") for supported models.
        raw:
          type: boolean
          description: When true, returns the raw response from the model without any prompt templating
        keep_alive:
          oneOf:
            - type: string
            - type: number
          description: Model keep-alive duration (for example `5m` or `0` to unload immediately)
        timeout:
          oneOf:
            - type: string
            - type: number
          description: >
            Per-call wall-clock deadline (e.g. `30s` or nanoseconds JSON). Why: Hermes
            needs server-enforced bounds; client disconnect alone leaves stuck
            generations holding QoS/slots. On DeadlineExceeded returns HTTP 504
            `{"error":"request timeout","timeout_seconds":N}` (≠ 499 cancel).
        options:
          $ref: "#/components/schemas/ModelOptions"
        logprobs:
          type: boolean
          description: Whether to return log probabilities of the output tokens
        top_logprobs:
          type: integer
          description: Number of most likely tokens to return at each token position when logprobs are enabled
    GenerateResponse:
      type: object
      properties:
        model:
          type: string
          description: Model name
        created_at:
          type: string
          description: ISO 8601 timestamp of response creation
        response:
          type: string
          description: The model's generated text response
        thinking:
          type: string
          description: The model's generated thinking output
        done:
          type: boolean
          description: Indicates whether generation has finished
        done_reason:
          type: string
          description: >
            Reason the generation stopped (e.g. stop, length, preempted).
            Zerollama may set `empty_generation` when the done chunk has empty
            response+thinking and zero eval tokens (not a semantic refusal).
            `preempted` (M15f) means scheduler soft-cancelled mid-decode (MLX
            interactive-over-background) — do not treat partial output as final.
            Runner crashes use error NDJSON with `cause=host_unstable` instead.
        preempted_reason:
          type: string
          description: >
            Present when done_reason=preempted (e.g. lower_wait_interactive).
            Also on pre-start wait-abort error bodies (M15e).
        total_duration:
          type: integer
          description: Time spent generating the response in nanoseconds
        load_duration:
          type: integer
          description: Time spent loading the model in nanoseconds
        prompt_eval_count:
          type: integer
          description: Number of input tokens in the prompt (post-truncation / after context shift)
        prompt_eval_duration:
          type: integer
          description: Time spent evaluating the prompt in nanoseconds
        eval_count:
          type: integer
          description: Number of output tokens generated in the response
        eval_duration:
          type: integer
          description: Time spent generating tokens in nanoseconds
        prompt_truncated:
          type: boolean
          description: |
            True when the prompt was shortened to fit `num_ctx` (Go chatPrompt
            tail-trim, runner token trim, or runtime detection of llama-server
            context shift). Why: without this flag, clients only saw
            `prompt_eval_count` pinned near `num_ctx` on HTTP 200.
        original_prompt_tokens:
          type: integer
          description: |
            Token count before truncation. Prefer this over inferring size from
            `prompt_eval_count` when `prompt_truncated` is true (e.g. ~44k when
            only ~8k fit).
        messages_truncated:
          type: boolean
          description: True when older chat messages were dropped to fit context
        messages_dropped:
          type: integer
          description: Number of leading chat messages removed to fit `num_ctx`
        logprobs:
          type: array
          items:
            $ref: "#/components/schemas/Logprob"
          description: Log probability information for the generated tokens when logprobs are enabled
    GenerateStreamEvent:
      type: object
      properties:
        model:
          type: string
          description: Model name
        created_at:
          type: string
          description: ISO 8601 timestamp of response creation
        response:
          type: string
          description: The model's generated text response for this chunk
        thinking:
          type: string
          description: The model's generated thinking output for this chunk
        done:
          type: boolean
          description: Indicates whether the stream has finished
        done_reason:
          type: string
          description: Reason streaming finished
        total_duration:
          type: integer
          description: Time spent generating the response in nanoseconds
        load_duration:
          type: integer
          description: Time spent loading the model in nanoseconds
        prompt_eval_count:
          type: integer
          description: Number of input tokens in the prompt (post-truncation / after context shift); set on the final chunk
        prompt_eval_duration:
          type: integer
          description: Time spent evaluating the prompt in nanoseconds
        eval_count:
          type: integer
          description: Number of output tokens generated in the response
        eval_duration:
          type: integer
          description: Time spent generating tokens in nanoseconds
        prompt_truncated:
          type: boolean
          description: |
            Present on the final chunk when the prompt was shortened to fit `num_ctx`.
            Why: streaming clients previously only saw `prompt_eval_count` pinned near the window.
        original_prompt_tokens:
          type: integer
          description: Token count before truncation (final chunk when `prompt_truncated` is true)
        messages_truncated:
          type: boolean
          description: True when older chat messages were dropped (final chunk)
        messages_dropped:
          type: integer
          description: Number of leading messages removed to fit `num_ctx` (final chunk)
    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
          description: Author of the message.
        content:
          type: string
          description: Message text content
        images:
          type: array
          items:
            type: string
            description: Base64-encoded image content
          description: Optional list of inline images for multimodal models
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
          description: Tool call requests produced by the model
    ToolCall:
      type: object
      properties:
        function:
          type: object
          required: [name]
          properties:
            name:
              type: string
              description: Name of the function to call
            description:
              type: string
              description: What the function does
            arguments:
              type: object
              description: JSON object of arguments to pass to the function
    ToolDefinition:
      type: object
      required: [type, function]
      properties:
        type:
          type: string
          enum: [function]
          description: Type of tool (always `function`)
        function:
          type: object
          required: [name, parameters]
          properties:
            name:
              type: string
              description: Function name exposed to the model
            description:
              type: string
              description: Human-readable description of the function
            parameters:
              type: object
              description: JSON Schema for the function parameters
    ChatRequest:
      type: object
      required: [model, messages]
      properties:
        model:
          type: string
          description: Model name
        messages:
          type: array
          description: Chat history as an array of message objects (each with a role and content)
          items:
            $ref: "#/components/schemas/ChatMessage"
        tools:
          type: array
          description: Optional list of function tools the model may call during the chat
          items:
            $ref: "#/components/schemas/ToolDefinition"
        format:
          description: >
            Structured output. Accepts `"json"`, a JSON Schema object, or
            `{"type":"gbnf","grammar":"root ::= ..."}` (M15f). Why GBNF on format
            (not response_format): OpenAI has no GBNF type — use extra_body.format
            on /v1. tools + format → HTTP 400.
          oneOf:
            - type: string
            - type: object
        options:
          $ref: "#/components/schemas/ModelOptions"
        stream:
          type: boolean
          default: true
        think:
          oneOf:
            - type: boolean
            - type: string
              enum: [high, medium, low]
          description: When true, returns separate thinking output in addition to content. Can be a boolean (true/false) or a string ("high", "medium", "low") for supported models.
        keep_alive:
          oneOf:
            - type: string
            - type: number
          description: Model keep-alive duration (for example `5m` or `0` to unload immediately)
        timeout:
          oneOf:
            - type: string
            - type: number
          description: >
            Per-call wall-clock deadline (e.g. `30s`). Why: same as GenerateRequest.timeout —
            server WithTimeout on schedule wait + decode; 504 on deadline.
        logprobs:
          type: boolean
          description: Whether to return log probabilities of the output tokens
        top_logprobs:
          type: integer
          description: Number of most likely tokens to return at each token position when logprobs are enabled
    ChatResponse:
      type: object
      properties:
        model:
          type: string
          description: Model name used to generate this message
        created_at:
          type: string
          format: date-time
          description: Timestamp of response creation (ISO 8601)
        message:
          type: object
          properties:
            role:
              type: string
              enum: [assistant]
              description: Always `assistant` for model responses
            content:
              type: string
              description: Assistant message text
            thinking:
              type: string
              description: Optional deliberate thinking trace when `think` is enabled
            tool_calls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"
              description: Tool calls requested by the assistant
            images:
              type: array
              items:
                type: string
              description: Optional base64-encoded images in the response
        done:
          type: boolean
          description: Indicates whether the chat response has finished
        done_reason:
          type: string
          description: >
            Reason the response finished (stop, length, tool_calls, preempted, …).
            Zerollama may set `empty_generation` for empty done chunks (not a
            semantic refusal). `preempted` (M15f) = mid-stream soft cancel —
            retry; do not act on partial tool calls. Runner crashes use error
            NDJSON with `cause=host_unstable`.
        preempted_reason:
          type: string
          description: >
            Present when done_reason=preempted (e.g. lower_wait_interactive).
        total_duration:
          type: integer
          description: Total time spent generating in nanoseconds
        load_duration:
          type: integer
          description: Time spent loading the model in nanoseconds
        prompt_eval_count:
          type: integer
          description: Number of tokens in the prompt (post-truncation / after context shift)
        prompt_eval_duration:
          type: integer
          description: Time spent evaluating the prompt in nanoseconds
        eval_count:
          type: integer
          description: Number of tokens generated in the response
        eval_duration:
          type: integer
          description: Time spent generating tokens in nanoseconds
        prompt_truncated:
          type: boolean
          description: |
            True when the prompt was shortened to fit `num_ctx` (Go chatPrompt
            tail-trim, runner token trim, or runtime detection of llama-server
            context shift). Why: without this flag, clients only saw
            `prompt_eval_count` pinned near `num_ctx` on HTTP 200.
        original_prompt_tokens:
          type: integer
          description: |
            Token count before truncation. Prefer this over inferring size from
            `prompt_eval_count` when `prompt_truncated` is true.
        messages_truncated:
          type: boolean
          description: True when older chat messages were dropped to fit context
        messages_dropped:
          type: integer
          description: Number of leading chat messages removed to fit `num_ctx`
        logprobs:
          type: array
          items:
            $ref: "#/components/schemas/Logprob"
          description: Log probability information for the generated tokens when logprobs are enabled
    ChatStreamEvent:
      type: object
      properties:
        model:
          type: string
          description: Model name used for this stream event
        created_at:
          type: string
          format: date-time
          description: When this chunk was created (ISO 8601)
        message:
          type: object
          properties:
            role:
              type: string
              description: Role of the message for this chunk
            content:
              type: string
              description: Partial assistant message text
            thinking:
              type: string
              description: Partial thinking text when `think` is enabled
            tool_calls:
              type: array
              items:
                $ref: "#/components/schemas/ToolCall"
              description: Partial tool calls, if any
            images:
              type: array
              items:
                type: string
              description: Partial base64-encoded images, when present
        done:
          type: boolean
          description: True for the final event in the stream
        done_reason:
          type: string
          description: Reason streaming finished (final event)
        prompt_eval_count:
          type: integer
          description: Prompt tokens evaluated (final event; post-truncation)
        prompt_truncated:
          type: boolean
          description: |
            Final event only. True when the prompt was shortened to fit `num_ctx`.
            Why: without this, agents inferred overflow from `prompt_eval_count` ≈ `num_ctx`.
        original_prompt_tokens:
          type: integer
          description: Pre-truncation token count (final event when `prompt_truncated` is true)
        messages_truncated:
          type: boolean
          description: Final event only. True when older messages were dropped
        messages_dropped:
          type: integer
          description: Leading messages removed to fit context (final event)
    StatusEvent:
      type: object
      properties:
        status:
          type: string
          description: Human-readable status message
        digest:
          type: string
          description: Content digest associated with the status, if applicable
        total:
          type: integer
          description: Total number of bytes expected for the operation
        completed:
          type: integer
          description: Number of bytes transferred so far
    StatusResponse:
      type: object
      properties:
        status:
          type: string
          description: Current status message
    EmbedRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
          description: Model name
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: Text or array of texts to generate embeddings for
        truncate:
          type: boolean
          default: true
          description: If true, truncate inputs that exceed the context window. If false, returns an error.
        dimensions:
          type: integer
          description: Number of dimensions to generate embeddings for
        keep_alive:
          type: string
          description: Model keep-alive duration
        options:
          $ref: "#/components/schemas/ModelOptions"
    EmbedResponse:
      type: object
      properties:
        model:
          type: string
          description: Model that produced the embeddings
        embeddings:
          type: array
          items:
            type: array
            items:
              type: number
          description: Array of vector embeddings
        total_duration:
          type: integer
          description: Total time spent generating in nanoseconds
        load_duration:
          type: integer
          description: Load time in nanoseconds
        prompt_eval_count:
          type: integer
          description: Number of input tokens processed to generate embeddings
    CreateRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
          description: Name for the model to create
        from:
          type: string
          description: Existing model to create from
        template:
          type: string
          description: Prompt template to use for the model
        license:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
          description: License string or list of licenses for the model
        system:
          type: string
          description: System prompt to embed in the model
        parameters:
          type: object
          description: Key-value parameters for the model
        messages:
          description: Message history to use for the model
          type: array
