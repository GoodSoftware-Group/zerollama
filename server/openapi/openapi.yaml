        license:
          type: string
          description: The license of the model
        modified_at:
          type: string
          description: Last modified timestamp in ISO 8601 format
        details:
          type: object
          description: High-level model details
        template:
          type: string
          description: The template used by the model to render prompts
        capabilities:
          type: array
          items:
            type: string
          description: List of supported features
        model_info:
          type: object
          description: Additional model metadata
    ModelSummary:
      type: object
      description: Summary information for a locally available model
      properties:
        name:
          type: string
          description: Model name
        model:
          type: string
          description: Model name
        remote_model:
          type: string
          description: Name of the upstream model, if the model is remote
        remote_host:
          type: string
          description: URL of the upstream Ollama host, if the model is remote
        modified_at:
          type: string
          description: Last modified timestamp in ISO 8601 format
        size:
          type: integer
          description: Total size of the model on disk in bytes
        digest:
          type: string
          description: SHA256 digest identifier of the model contents
        details:
          type: object
          description: Additional information about the model's format and family
          properties:
            format:
              type: string
              description: Model file format (for example `gguf`)
            family:
              type: string
              description: Primary model family (for example `llama`)
            families:
              type: array
              items:
                type: string
              description: All families the model belongs to, when applicable
            parameter_size:
              type: string
              description: Approximate parameter count label (for example `7B`, `13B`)
            quantization_level:
              type: string
              description: Quantization level used (for example `Q4_0`)
    ListResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummary"
    Ps:
      type: object
      properties:
        name:
          type: string
          description: Name of the running model
        model:
          type: string
          description: Name of the running model
        size:
          type: integer
          description: Size of the model in bytes
        digest:
          type: string
          description: SHA256 digest of the model
        details:
          type: object
          description: Model details such as format and family
        expires_at:
          type: string
          description: Time when the model will be unloaded
        size_vram:
          type: integer
          description: VRAM usage in bytes
        context_length:
          type: integer
          description: Context length for the running model
        pending:
          type: integer
          description: Queued prompts waiting on this loaded model
          minimum: 0
    PsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/Ps"
          description: Currently running models
        pending:
          type: integer
          description: Number of prompts waiting in the ggml scheduler queue
          minimum: 0
    WebSearchRequest:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: Search query string
        max_results:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
          description: Maximum number of results to return
    WebSearchResult:
      type: object
      properties:
        title:
          type: string
          description: Page title of the result
        url:
          type: string
          format: uri
          description: Resolved URL for the result
        content:
          type: string
          description: Extracted text content snippet
    WebSearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/WebSearchResult"
          description: Array of matching search results
    WebFetchRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: The URL to fetch
    WebFetchResponse:
      type: object
      properties:
        title:
          type: string
          description: Title of the fetched page
        content:
          type: string
          description: Extracted page content
        links:
          type: array
          items:
            type: string
            format: uri
          description: Links found on the page
    VersionResponse:
      type: object
      description: >
        zerollama adds a `zerollama` block advertising fleet capabilities and the
        options.zerollama QoS contract, so agents can probe once and only send
        zerollama-specific hints to nodes that understand them.
      properties:
        version:
          type: string
          description: Version of zerollama/Ollama
        distribution:
          type: string
          description: "\"zerollama\" on this fork"
        edge_build:
          type: boolean
          description: True for edge builds (llama-server path only, no in-process ggml runner)
        zerollama:
          type: object
          description: Fleet capability + QoS advertisement (see docs/multimodal-backends.md, docs/scheduling-vram-policy.md, docs/inference-wishlist-host.md)
          properties:
            capabilities:
              type: object
              additionalProperties: true
              description: >
                Feature flags. Prefer live GET /api/version. Includes mlx_qos,
                fulfillment, session_qos_gate, runner_paths; Phase A/B capacity
                (runtime_config, can_load, metrics, admission_retry_after,
                error_timings, empty_gen_classify, priority_queues, residency_policy,
                pin_reserve, propose_sidecar). Deferred false: stable_multi_model_swap.
            qos:
              $ref: "#/components/schemas/ZerollamaVersionQoS"
    InferenceError:
      type: object
      description: >
        Error body on generate/chat (JSON or NDJSON). Busy 503s include retry_after;
        stream/runner failures may include cause=host_unstable and partial timings;
        pin/VRAM conflicts use cause=runtime_pin_gguf or runtime_pin_ggml.
        M15e: QoS wait-abort / busy may include preempted_reason; per-call timeout
        uses HTTP 504 with timeout_seconds (not this schema alone).
      required: [error]
      properties:
        error:
          type: string
        status:
          type: integer
        retry_after:
          type: integer
          description: Seconds to wait before retry (also sent as Retry-After header on 503)
        preempted_reason:
          type: string
          description: >
            Why the request aborted while deferred behind higher QoS (e.g.
            lower_wait_interactive, wait_parent, fulfillment_exclusive). Why:
            Hermes needs to distinguish QoS wait abort from generic cancel /
            queue-full. Not mid-stream hard preemption.
        timeout_seconds:
          type: number
          description: >
            Present on HTTP 504 when per-call `timeout` fired (DeadlineExceeded).
            Distinct from 499 client cancel.
        cause:
          type: string
          description: >
            host_unstable (runner/process exit); runtime_pin_gguf (active pin holds a
            different Python GGUF); runtime_pin_ggml (pinned/in-use ggml still resident
            after pin-respecting unload — resume blocked to avoid dual-stack OOM);
            runtime_vram (other prepareRuntimeVRAM failures).
          enum:
            - host_unstable
            - runtime_pin_gguf
            - runtime_pin_ggml
            - runtime_vram
        total_duration:
          type: integer
          description: Nanoseconds wall time until failure
        load_duration:
          type: integer
          description: Nanoseconds spent loading before failure
        time_to_first_token:
          type: integer
          description: Nanoseconds to first token when a token was emitted
    InferenceConfigStatus:
      type: object
      description: Effective scheduler knobs on GET /api/status (inference.config)
      properties:
        num_parallel:
          type: integer
        num_parallel_auto:
          type: boolean
        max_loaded_models:
          type: integer
          description: Effective cap (after 0 → 3×GPU default)
        max_loaded_configured:
          type: integer
          description: Raw OLLAMA_MAX_LOADED_MODELS
        max_queue:
          type: integer
        keep_alive:
          type: string
        load_timeout:
          type: string
        runtime_max_queue:
          type: integer
        same_model_multi_copy:
          type: boolean
        residency_owner:
          type: string
          description: go_sched | runtime_swap | mixed
        num_parallel_means_slots:
          type: boolean
          description: Always true — NUM_PARALLEL is slots inside one runner
        inference_profile:
          type: string
          description: Raw ZEROLLAMA_INFERENCE_PROFILE (or "(default)")
        inference_profile_resolved:
          type: string
          description: Resolved lane — throughput | agent | vram | off
        inference_profile_applied:
          type: array
          items:
            type: string
          description: Soft-default env keys applied by the lane (key=value)
        gpu_profile_id:
          type: string
          description: Last L1 GPU JSON id applied on Go→llama-server launch (e.g. rtx-5080)
    FleetStatusResponse:
      type: object
      description: >
        Response for GET /api/status (fleet inference snapshot). Distinct from
        pull/create StatusResponse which is only {status}.
      properties:
        cloud:
          type: object
          properties:
            disabled:
              type: boolean
            source:
              type: string
        inference:
          type: object
          properties:
            ggml:
              type: object
              additionalProperties: true
              description: pending/active/loaded/loads_paused/loaded_models
            runtime:
              type: object
              additionalProperties: true
              description: enabled/available/waiting/running/llama_loaded
            backend:
              type: object
              additionalProperties: true
            config:
              $ref: "#/components/schemas/InferenceConfigStatus"
            pins:
              type: array
              description: >
                Active /api/pin leases (Phase B). Soft UnloadAllRunners respects these;
                conflicting runtime GGUF or residual pinned ggml yields 503 on chat/generate.
              items:
                $ref: "#/components/schemas/PinStatus"
            training:
              type: object
              additionalProperties: true
    PinStatus:
      type: object
      description: One active pin on GET /api/status → inference.pins
      properties:
        pin_id:
          type: string
        models:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        project_id:
          type: string
        co_resident:
          type: boolean
        notes:
          type: string
    CanLoadRequest:
      type: object
      required: [model]
      properties:
        model:
          type: string
        options:
          type: object
          additionalProperties: true
          description: Optional num_ctx, gguf, etc.
    CanLoadResponse:
      type: object
      description: >
        Always HTTP 200. confidence=exact uses runtime VRAM estimate; heuristic
        is ggml count/concurrency only (does not guarantee VRAM fit).
      properties:
        model:
          type: string
        backend:
          type: string
        can_load:
          type: boolean
        confidence:
          type: string
          enum: [exact, heuristic]
        already_loaded:
          type: boolean
        needs_eviction:
          type: boolean
        eviction_reason:
          type: string
        busy:
          type: boolean
        busy_reason:
          type: string
        loads_paused:
          type: boolean
        queue:
          type: object
          additionalProperties: true
        warm:
          type: object
          additionalProperties: true
        vram_estimate:
          type: object
          additionalProperties: true
        vram_budget:
          type: object
          additionalProperties: true
        suggested_max_num_ctx:
          type: integer
        max_loaded_models:
          type: integer
        loaded_count:
          type: integer
        device_count:
          type: integer
          description: >
            Host GPU count (runtime topology or ggml discover). Why: Hermes multi-GPU
            awareness without scraping /health. Not a TP planner.
        tensor_parallel:
          type: integer
          description: Effective TP width from runtime config (often 1 on single GPU)
        split_mode:
          type: string
          description: Runtime split_mode (e.g. layer, row, tensor) when TP > 1
        tensor_split:
          type: array
          items:
            type: number
          description: Per-device split weights when configured
        main_gpu:
          type: integer
          description: Primary GPU index from runtime config
        notes:
          type: string
    ProposeLoadRequest:
      type: object
      required: [models]
      properties:
        models:
          type: array
          maxItems: 8
          items:
            $ref: "#/components/schemas/CanLoadRequest"
    ProposeLoadResponse:
      type: object
      properties:
        models:
          type: array
          items:
            $ref: "#/components/schemas/CanLoadResponse"
        plan:
          type: object
          properties:
            fits_without_eviction:
              type: boolean
            co_resident:
              type: boolean
              description: False when batch has two or more distinct runtime GGUFs
            serialize_required:
              type: boolean
            load_order:
              type: array
              items:
                type: string
            evict_candidates:
              type: array
              items:
                type: string
            confidence:
              type: string
            device_count:
              type: integer
              description: Max device_count across batch models
            tensor_parallel:
              type: integer
              description: Highest tensor_parallel seen in the batch (with matching split fields)
            split_mode:
              type: string
            tensor_split:
              type: array
              items:
                type: number
            main_gpu:
              type: integer
            notes:
              type: string
        warm:
          type: object
          additionalProperties: true
    PinRequest:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items:
            type: string
        ttl_seconds:
          type: integer
        project_id:
          type: string
    PinResponse:
      type: object
      properties:
        pin_id:
          type: string
        expires_at:
          type: string
          format: date-time
        models:
          type: array
          items:
            type: string
        project_id:
          type: string
        co_resident:
          type: boolean
        can_pin:
          type: boolean
        notes:
          type: string
    CachePinRequest:
      type: object
      required: [prompt_cache_key]
      description: >
        Prefix-cache lease for a prompt_cache_key. Why separate from /api/pin:
        model residency ≠ L3 disk / MLX trie branch residency. Does not force
        idle llama-server id_slot retention while no request is in flight.
      properties:
        prompt_cache_key:
          type: string
          description: Stable thread/session key (same as request prompt_cache_key)
        ttl_seconds:
          type: integer
          description: Lease TTL; defaults to PinDefaultTTL when omitted
        project_id:
          type: string
          description: Optional harness attribution
    CachePinResponse:
      type: object
      properties:
        pin_id:
          type: string
        prompt_cache_key:
          type: string
        expires_at:
          type: string
          format: date-time
        project_id:
          type: string
        notes:
          type: string
          description: Documents MLX/L3 scope and the idle-slot limitation
        can_pin:
          type: boolean
    CacheWarmRequest:
      type: object
      required: [model, prompt, prompt_cache_key]
      description: >
        Boot-time / preload prefill for prompt_cache_key. Runs the prefix
        decode with no useful sampling; does not return generated text.
        Safetensors (MLX) models warm via the native runner trie; GGUF models
        warm via the Python runtime L3 slot path.
      properties:
        model:
          type: string
          description: Required. Resolves MLX safetensors or GGUF on-disk path
        prompt:
          type: string
          description: System prompt / agent template text to prefill into the KV cache
        prompt_cache_key:
          type: string
          description: Stable thread/session key (same as request prompt_cache_key)
        num_ctx:
          type: integer
          description: Optional context size override for admission/sizing
        pin:
          type: boolean
          description: Also create an /api/cache/pin lease for this key in the same call
        ttl_seconds:
          type: integer
          description: Lease TTL when pin=true; defaults to PinDefaultTTL when omitted
        options:
          type: object
          description: Extra runtime options merged in verbatim (e.g. cache_salt)
          additionalProperties: true
    CacheWarmResponse:
      type: object
      properties:
        warmed:
          type: boolean
        prompt_cache_key:
          type: string
        kv_decode_steps:
          type: integer
          description: In-process decode step count for the prefill (null when not tracked)
        pin_id:
          type: string
          description: Present only when pin=true was requested
        expires_at:
          type: string
          format: date-time
        notes:
          type: string
    ChatCompletionsBatchRequestItem:
      type: object
      description: >
        One OpenAI-shaped chat body in a batch. Must be text-only (no tools,
        vision, think, logprobs). Model may be omitted when the top-level
        `model` is set; otherwise every item must use the same model string.
      required: [messages]
      properties:
        model:
          type: string
          description: Must match top-level / sibling models when set
        messages:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: true
          description: OpenAI chat messages (text content only)
        max_tokens:
          type: integer
          minimum: 1
          description: Per-item cap; batch uses max across items as n_predict
        temperature:
          type: number
        top_p:
          type: number
        prompt_cache_key:
          type: string
          description: Optional per-row prefix-cache key (collected into options.prompt_cache_keys)
        options:
          type: object
          additionalProperties: true
        tools:
          description: Rejected when present (including empty array)
          nullable: true
        tool_choice:
          description: Rejected unless null / omitted / "none"
          nullable: true
        stream:
          type: boolean
          description: Ignored on items; top-level stream must be false
      additionalProperties: true
    ChatCompletionsBatchRequest:
      type: object
      description: >
        Public batch chat (M15e). Why thin Go proxy + Python generate_batch:
        Go pending_queue is model-load only; decode batching already lives in
        the runtime. Same model required; tools/vision/think/stream rejected.
        Clients with mixed models must group by model and issue one POST per
        group (order of `completions` matches `requests` within that call).
      properties:
        model:
          type: string
          description: Shared model for all nested requests (required if items omit model)
        stream:
          type: boolean
          description: Must be false / omitted — streaming batch not supported yet
        requests:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/ChatCompletionsBatchRequestItem"
        options:
          type: object
          additionalProperties: true
          description: Shared options (gguf injected by Go proxy when available)
      required: [requests]
    ChatCompletionsBatchResponse:
      type: object
      description: >
        Stable wire shape from Python run_v1_chat_completions_batch.
        `completions[i]` corresponds to `requests[i]` (same order). Each
        completion is a normal OpenAI chat.completion object (usage tokens may
        be zero placeholders on the runtime path).
      required: [object, model, completions, count]
      properties:
        object:
          type: string
          enum: [chat.completion.batch]
          description: Discriminator — not a bare list and not chat.completion
        model:
          type: string
          description: Resolved shared model for the batch
        count:
          type: integer
          minimum: 1
          description: len(completions); equals len(requests) on success
        completions:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/ChatCompletionBatchItem"
    ChatCompletionBatchItem:
      type: object
      description: >
        Same shape as a single /v1/chat/completions JSON body (object=
        chat.completion). Optional zerollama extension `vram_num_ctx` may appear.
      required: [id, object, created, model, choices]
      properties:
        id:
          type: string
        object:
          type: string
          enum: [chat.completion]
        created:
          type: integer
        model:
          type: string
        system_fingerprint:
          type: string
        choices:
          type: array
          items:
            type: object
            required: [index, message, finish_reason]
            properties:
              index:
                type: integer
              message:
                type: object
                required: [role, content]
                properties:
                  role:
                    type: string
                  content:
                    type: string
                    nullable: true
              finish_reason:
                type: string
                description: Typically "stop" (batch is text-only; no tool_calls)
        usage:
          type: object
          additionalProperties: true
        vram_num_ctx:
          type: object
          additionalProperties: true
          description: Optional zerollama clamp visibility extension
      additionalProperties: true
    TokenLogprob:
      type: object
      description: Log probability information for a single token alternative
      properties:
        token:
          type: string
          description: The text representation of the token
        logprob:
          type: number
          description: The log probability of this token
        bytes:
          type: array
          items:
            type: integer
          description: The raw byte representation of the token
    Logprob:
      type: object
      description: Log probability information for a generated token
      properties:
        token:
          type: string
          description: The text representation of the token
        logprob:
          type: number
          description: The log probability of this token
        bytes:
          type: array
          items:
            type: integer
          description: The raw byte representation of the token
        top_logprobs:
          type: array
          items:
            $ref: "#/components/schemas/TokenLogprob"
          description: Most likely tokens and their log probabilities at this position

    SpeechCreateRequest:
      type: object
      required: [model, input]
      properties:
        model:
          type: string
          description: Speech model tag (e.g. piper-lessac, chatterbox, orpheus, kokoro)
        input:
          type: string
          description: Text to synthesize (max 4096 Unicode characters)
          maxLength: 4096
        voice:
          type: string
          description: Voice id from GET /v1/audio/voices (piper_voice_* or remote catalog)
        response_format:
          type: string
          description: >
            Optional OpenAI-compatible format hint. Piper always returns WAV and
            ignores other values; remote-tts returns whatever the upstream sends
            (Content-Type). No server-side transcoding.
          enum: [mp3, opus, aac, flac, wav, pcm]
        speed:
          type: number
          minimum: 0.25
          maximum: 4.0
          description: Speech rate (OpenAI-compatible)
        emotion:
          type: string
          description: zerollama extension — forwarded by remote-tts (Chatterbox/Orpheus); ignored by Piper
    SpeechVoice:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        backend:
          type: string
          description: piper or remote-tts
        description:
          type: string
    VoicesListResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            type: object
            properties:
              model:
                type: string
              backend:
                type: string
              voices:
                type: array
                items:
                  $ref: "#/components/schemas/SpeechVoice"
    TranscriptionCreateRequest:
      type: object
      required: [file, model]
      properties:
        file:
          type: string
          format: binary
          description: Audio file to transcribe (multipart field name `file`)
        model:
          type: string
          description: STT model (e.g. whisper-base) or multimodal chat model
        language:
          type: string
          description: Optional language hint (form field `language`)
        prompt:
          type: string
          description: Optional context prepended for transcription (form field `prompt`)
        response_format:
          type: string
          enum: [json, text, verbose_json]
          description: Form field `response_format` (json default; text and verbose_json supported)
    TranscriptionResponse:
      type: object
      properties:
        text:
          type: string
    VideoCreateRequest:
      type: object
      required: [model, prompt]
      properties:
        model:
          type: string
        prompt:
          type: string
        size:
          type: string
          description: Optional size string (e.g. 1280x704)
        seconds:
          type: string
          description: Accepted for OpenAI compatibility; frame count comes from options
        seed:
          type: integer
          format: int64
          description: Optional seed
        options:
          type: object
          additionalProperties: true
          description: >
            Backend options. Wan: frames, steps, media_session, keyframes (label list
            after PUT /v1/media/{session}/{label}). WHY labels not inline bytes: keep
            create JSON small; CAS + media_missing recovery — docs/media-uploads.md.
    MediaPutResponse:
      type: object
      properties:
        session:
          type: string
        label:
          type: string
        digest:
          type: string
        bytes:
          type: integer
          format: int64
        kind:
          type: string
          enum: [image, video, other]
    MediaSessionList:
      type: object
      properties:
        session:
          type: string
        labels:
          type: array
          items:
            type: object
            properties:
              label:
                type: string
              digest:
                type: string
              bytes:
                type: integer
                format: int64
              content_type:
                type: string
              kind:
                type: string
                enum: [image, video, other]
    ChatCompletionRequest:
      type: object
      required: [model, messages]
      description: >
        OpenAI-compatible chat. Zerollama extensions (M15c/M15e): think, keep_alive,
        timeout, options/zerollama QoS, prompt_cache_key. Why bind think: allowlisting
        alone silently dropped Hermes `think` under trap 77.
      properties:
        model:
          type: string
        messages:
          type: array
          items:
            type: object
            additionalProperties: true
        stream:
          type: boolean
        temperature:
          type: number
        think:
          oneOf:
            - type: boolean
            - type: string
              enum: [high, medium, low]
          description: >
            Native Ollama think knob. Precedence over reasoning_effort /
            enable_thinking / chat_template_kwargs aliases.
        enable_thinking:
          type: boolean
          description: Harness alias (vLLM/SGLang); mapped to Think when Think unset
        keep_alive:
          oneOf:
            - type: string
            - type: number
          description: Model keep-alive (e.g. `30m`); also via extra_body
        timeout:
          oneOf:
            - type: string
            - type: number
          description: >
            Per-call deadline; also via extra_body. 504 on DeadlineExceeded.
        format:
          description: >
            Native structured output / GBNF (M15f). Prefer response_format for
            JSON Schema; use format for `{"type":"gbnf","grammar":"..."}`.
            Also via extra_body.format. tools + format → 400.
          oneOf:
            - type: string
            - type: object
        prompt_cache_key:
          type: string
          description: Stable KV/session key (also options / extra_body)
        options:
          type: object
          additionalProperties: true
          description: Ollama options including nested zerollama QoS
        extra_body:
          type: object
          additionalProperties: true
          description: >
            SDK clients often flatten this onto the HTTP root (M15c). Flat qos_class /
            project_* / timeout / keep_alive are allowlisted and folded.
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message describing what went wrong
paths:
  /api/generate:
    post:
      summary: Generate a response
      description: Generates a response for the provided prompt
      operationId: generate
      x-mint:
        href: /api/generate
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3",
              "prompt": "Why is the sky blue?"
            }'
        - lang: bash
          label: Non-streaming
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3",
              "prompt": "Why is the sky blue?",
              "stream": false
            }'
        - lang: bash
          label: With options
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3",
              "prompt": "Why is the sky blue?",
              "options": {
                "temperature": 0.8,
                "top_p": 0.9,
                "seed": 42
              }
            }'
        - lang: bash
          label: Structured outputs
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3",
              "prompt": "What are the populations of the United States and Canada?",
              "stream": false,
              "format": {
                "type": "object",
                "properties": {
                  "countries": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "country": {"type": "string"},
                        "population": {"type": "integer"}
                      },
                      "required": ["country", "population"]
                    }
                  }
                },
                "required": ["countries"]
              }
            }'
        - lang: bash
          label: With images
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3",
              "prompt": "What is in this picture?",
              "images": [""]
            }'
        - lang: bash
          label: Load model
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3"
            }'
        - lang: bash
          label: Unload model
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3",
              "keep_alive": 0
            }'
        - lang: bash
          label: Runner tuning (many models, mixed VRAM)
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3",
              "prompt": "Why is the sky blue?",
              "options": {
                "num_ctx": 8192,
                "kv_cache_type": "q8_0",
                "ggml_clamp_num_ctx": true,
                "ggml_auto_kv_quant": true,
                "num_gpu": -1
              }
            }'
        - lang: bash
          label: QoS scheduling (agents/harnesses)
          source: |
            curl http://localhost:11434/api/generate -d '{
              "model": "gemma3",
              "prompt": "Summarize this in one line.",
              "options": {
                "prompt_cache_key": "thread-42",
                "zerollama": {
                  "qos_class": "background",
                  "session_group": "my-harness",
                  "project_name": "my-harness"
                }
              }
            }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateRequest"
            example:
              model: gemma3
              prompt: Why is the sky blue?
      responses:
        "200":
          description: Generation responses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateResponse"
              example:
                model: "gemma3"
                created_at: "2025-10-17T23:14:07.414671Z"
                response: "Hello! How can I help you today?"
                done: true
                done_reason: "stop"
                total_duration: 174560334
                load_duration: 101397084
                prompt_eval_count: 11
                prompt_eval_duration: 13074791
                eval_count: 18
                eval_duration: 52479709
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/GenerateStreamEvent"
        "503":
          description: >
            Server busy (max queue exceeded), Darwin Metal contention, or Phase B
            pin/VRAM conflict (cause=runtime_pin_gguf | runtime_pin_ggml).
            Includes Retry-After header and retry_after body field.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
              examples:
                queue_busy:
                  summary: Max pending queue
                  value:
                    error: "server busy, please try again.  maximum pending requests exceeded"
                    retry_after: 2
                runtime_pin_gguf:
                  summary: Pin holds a different runtime GGUF
                  value:
                    error: "runtime inference blocked: active pin holds a different GGUF; release the pin or use the pinned model"
                    retry_after: 2
                    cause: runtime_pin_gguf
                runtime_pin_ggml:
                  summary: Pinned ggml still resident
                  value:
                    error: "runtime inference blocked: ggml runners still resident (pin, fulfillment, or in-use); release pins or retry"
                    retry_after: 2
                    cause: runtime_pin_ggml
  /api/chat:
    post:
      summary: Generate a chat message
      description: Generate the next chat message in a conversation between a user and an assistant.
      operationId: chat
      x-mint:
        href: /api/chat
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "gemma3",
              "messages": [
                {
                  "role": "user",
                  "content": "why is the sky blue?"
                }
              ]
            }'
        - lang: bash
          label: Non-streaming
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "gemma3",
              "messages": [
                {
                  "role": "user",
                  "content": "why is the sky blue?"
                }
              ],
              "stream": false
            }'
        - lang: bash
          label: QoS scheduling (concurrent agents)
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "gemma3",
              "messages": [
                {"role": "user", "content": "why is the sky blue?"}
              ],
              "options": {
                "prompt_cache_key": "thread-42",
                "zerollama": {
                  "qos_class": "interactive",
                  "session_group": "my-harness"
                }
              }
            }'
        - lang: bash
          label: Structured outputs
          source: |
            curl -X POST http://localhost:11434/api/chat -H "Content-Type: application/json" -d '{
              "model": "gemma3",
              "messages": [
                {
                  "role": "user",
                  "content": "What are the populations of the United States and Canada?"
                }
              ],
              "stream": false,
              "format": {
                "type": "object",
                "properties": {
                  "countries": {
                    "type": "array",
                    "items": {
                      "type": "object",
                      "properties": {
                        "country": {"type": "string"},
                        "population": {"type": "integer"}
                      },
                      "required": ["country", "population"]
                    }
                  }
                },
                "required": ["countries"]
              }
            }'
        - lang: bash
          label: Tool calling
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "qwen3",
              "messages": [
                {
                  "role": "user",
                  "content": "What is the weather today in Paris?"
                }
              ],
              "stream": false,
              "tools": [
                {
                  "type": "function",
                  "function": {
                    "name": "get_current_weather",
                    "description": "Get the current weather for a location",
                    "parameters": {
                      "type": "object",
                      "properties": {
                        "location": {
                          "type": "string",
                          "description": "The location to get the weather for, e.g. San Francisco, CA"
                        },
                        "format": {
                          "type": "string",
                          "description": "The format to return the weather in, e.g. 'celsius' or 'fahrenheit'",
                          "enum": ["celsius", "fahrenheit"]
                        }
                      },
                      "required": ["location", "format"]
                    }
                  }
                }
              ]
            }'
        - lang: bash
          label: Thinking
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "gpt-oss",
              "messages": [
                {
                  "role": "user",
                  "content": "What is 1+1?"
                }
              ],
              "think": "low"
            }'
        - lang: bash
          label: Images
          source: |
            curl http://localhost:11434/api/chat -d '{
              "model": "gemma3",
              "messages": [
                {
                  "role": "user",
                  "content": "What is in this image?",
                  "images": [
                    ""
                  ]
                }
              ]
            }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
              example:
                model: "gemma3"
                created_at: "2025-10-17T23:14:07.414671Z"
                message:
                  role: "assistant"
                  content: "Hello! How can I help you today?"
                done: true
                done_reason: "stop"
                total_duration: 174560334
                load_duration: 101397084
                prompt_eval_count: 11
                prompt_eval_duration: 13074791
                eval_count: 18
                eval_duration: 52479709
            application/x-ndjson:
              schema:
                $ref: "#/components/schemas/ChatStreamEvent"
        "503":
          description: >
            Server busy (max queue exceeded), Darwin Metal contention, or Phase B
            pin/VRAM conflict (cause=runtime_pin_gguf | runtime_pin_ggml).
            Includes Retry-After header and retry_after body field.
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
              examples:
                queue_busy:
                  summary: Max pending queue
                  value:
                    error: "server busy, please try again.  maximum pending requests exceeded"
                    retry_after: 2
                runtime_pin_gguf:
                  summary: Pin holds a different runtime GGUF
                  value:
                    error: "runtime inference blocked: active pin holds a different GGUF; release the pin or use the pinned model"
                    retry_after: 2
                    cause: runtime_pin_gguf
                runtime_pin_ggml:
                  summary: Pinned ggml still resident
                  value:
                    error: "runtime inference blocked: ggml runners still resident (pin, fulfillment, or in-use); release pins or retry"
                    retry_after: 2
                    cause: runtime_pin_ggml
