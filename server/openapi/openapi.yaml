      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
            example:
              model: gemma3
      responses:
        "200":
          description: Model successfully deleted
  /api/status:
    get:
      summary: Fleet inference status and runtime config
      description: >
        Live ggml/runtime queue snapshot plus `inference.config` (NUM_PARALLEL,
        MAX_LOADED_MODELS, MAX_QUEUE, keep-alive, residency policy) and
        `inference.pins` (active Phase B pin leases). See
        docs/inference-wishlist-host.md.
      operationId: status
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/status
      responses:
        "200":
          description: Fleet status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetStatusResponse"
  /api/can-load:
    post:
      summary: Capacity dry-run (admit without loading)
      description: >
        Returns whether a model can be admitted under known checks without calling
        GetRunner. Always HTTP 200 with structured fields. Runtime path uses
        VRAM estimate (confidence=exact); ggml is count/group heuristic only.
        Fail closed when estimate/GGUF is unavailable. already_loaded requires
        GGUF path match (not merely any loaded model). needs_eviction means a
        swap would occur — thrash-sensitive clients should require !needs_eviction.
        M15e: surfaces host topology (device_count, tensor_parallel, split_mode,
        tensor_split, main_gpu) from runtime estimate — not a TP planner.
      operationId: canLoad
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/can-load -d '{"model":"llama3.2:latest","options":{"num_ctx":8192}}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CanLoadRequest"
      responses:
        "200":
          description: Dry-run result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanLoadResponse"
        "400":
          description: Missing model or invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
  /api/propose-load:
    post:
      summary: Multi-model capacity plan (dry-run)
      description: >
        Batch can-load with an honest co-residency plan. Never loads models.
        Why serialize_required: when the batch includes two or more distinct runtime
        GGUFs, plan.co_resident is false and serialize_required is true — Python holds
        one GGUF; implying co-resident warmth would thrash Orient interview graphs.
      operationId: proposeLoad
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/propose-load -d '{"models":[{"model":"llama3.2:latest"},{"model":"qwen2.5:latest"}]}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeLoadRequest"
      responses:
        "200":
          description: Plan result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposeLoadResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
  /api/pin:
    post:
      summary: Pin models against eviction (session lease)
      description: >
        Blocks eviction for listed model keys for a TTL. Does not load models.
        Soft UnloadAllRunners (runtime broker) respects pins; training / exclusive
        bench use Forced unload. Runtime GGUF paths are soft-pinned in Go — a later
        chat for a different GGUF returns 503 runtime_pin_gguf until the lease ends.
        Fail closed if the set (or another active lease) would yield two or more
        distinct runtime GGUFs (runtime_single_resident). Why fail closed: a successful
        dual pin would lie about Python residency.
      operationId: pinModels
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/pin -d '{"models":["llama3.2:latest"],"ttl_seconds":1800}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PinRequest"
      responses:
        "200":
          description: Pin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PinResponse"
        "400":
          description: Rejected (multi-runtime or over max)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
        "409":
          description: Conflicts with exclusive fulfillment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
  /api/pin/{id}:
    delete:
      summary: Release a pin lease early
      operationId: unpinModels
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Released
        "404":
          description: Pin not found or expired
  /api/cache/pin:
    post:
      summary: Pin prefix cache by prompt_cache_key
      description: >
        Lease keyed on prompt_cache_key (not a model name). Why separate from
        /api/pin: Hermes wants L3/MLX trie branches to survive idle gaps without
        forcing a model residency pin. Skips MLX trie eviction for that key and
        bumps Python L3 disk TTL. Does NOT retain idle llama-server id_slots
        while no request is in flight (documented in notes).
      operationId: cachePin
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/cache/pin -d '{"prompt_cache_key":"hermes:thread:42","ttl_seconds":3600}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CachePinRequest"
      responses:
        "200":
          description: Cache pin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CachePinResponse"
        "400":
          description: Missing prompt_cache_key or invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
  /api/cache/pin/{id}:
    delete:
      summary: Release a prefix-cache pin lease early
      operationId: cacheUnpin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Released
        "404":
          description: Cache pin not found or expired
  /api/cache/warm:
    post:
      summary: Prefill and (optionally) pin an L3 slot without generating text
      description: >
        Runs a real prefix decode for prompt_cache_key and returns as soon as
        the prefill completes — it does not return generated tokens. Safetensors
        (MLX) models warm via scheduleRunner + Completion(num_predict=1) into the
        MLX trie; GGUF models warm via the Python runtime L3 slot path. Why not
        just POST /api/generate with a throwaway num_predict: warm is a narrow
        boot-time contract (agent template preload, fleet warm-up) so callers
        don't need to discover a num_predict=1 convention, pay for
        sampling/logging as if it were a real completion, or guess whether the
        prefix actually landed in a pinned slot/trie. Set pin=true to also
        create an /api/cache/pin lease in the same call.
      operationId: cacheWarm
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/cache/warm -d '{
              "model": "llama3.2:3b",
              "prompt": "<system prompt / agent template>",
              "prompt_cache_key": "hermes:thread:42",
              "pin": true,
              "ttl_seconds": 3600
            }'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CacheWarmRequest"
      responses:
        "200":
          description: Prefix decoded (and pinned, if requested)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CacheWarmResponse"
        "400":
          description: Missing prompt / prompt_cache_key or invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
        "502":
          description: Runtime sidecar unreachable or rejected the warm request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
  /api/metrics:
    get:
      summary: Prometheus metrics
      description: >
        Prometheus text exposition (queue gauges and inference result counters).
        Content-Type text/plain; version=0.0.4.
      operationId: metrics
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/metrics
      responses:
        "200":
          description: Prometheus text
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP zerollama_ggml_pending GGML scheduler pending queue depth
                # TYPE zerollama_ggml_pending gauge
                zerollama_ggml_pending 0
  /api/version:
    get:
      summary: Get version and fleet capabilities
      description: >
        Retrieve the version of zerollama, plus a `zerollama` block advertising QoS/session
        capabilities. Agents should call this once per node and only send `options.zerollama`
        hints (qos_class, fulfillment, project_*, session_group, ...) when
        `zerollama.capabilities.mlx_qos` is present. Prefer live `/api/version` over
        static OpenAPI examples when they diverge.
      operationId: version
      x-codeSamples:
        - lang: bash
          label: Default
          source: |
            curl http://localhost:11434/api/version
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
              example:
                version: "0.30.11"
                distribution: "zerollama"
                edge_build: false
                zerollama:
                  capabilities:
                    mlx_qos: true
                    mlx_live_kv: true
                    prompt_cache_key: true
                    session_qos_gate: true
                    session_parent_defer: true
                    cache_reset: true
                    cache_level: ["auto", "gpu", "dram", "disk"]
                    radix_prefer_parent: true
                    fulfillment: true
                    runtime_config: true
                    can_load: true
                    metrics: true
                    admission_retry_after: true
                    error_timings: true
                    empty_gen_classify: true
                    pin_reserve: true
                    cache_pin: true
                    propose_sidecar: true
                    chat_completions_batch: true
                    request_timeout: true
                    preempted_reason: true
                    stable_multi_model_swap: false
                    runner_paths: ["mlx", "gguf_ggml", "gguf_llama_server"]
                    priority_queues:
                      session_qos_class: ["interactive", "auxiliary", "background"]
                      runtime_priority: ["high", "normal", "low"]
                      note: "existing; Phase A does not add new queue code"
                    residency_policy:
                      same_model_multi_copy: false
                      max_loaded_models_env: "OLLAMA_MAX_LOADED_MODELS"
                      num_parallel_means: "slots_inside_one_runner"
                  qos:
                    classes: ["interactive", "auxiliary", "background"]
                    fulfillment: ["complete", "benchmark"]
                    modalities:
                      - text
                      - vision
                      - video_understanding
                      - image_generation
                      - video_generation
                    options:
                      path: "options.zerollama"
                      fields:
                        qos_class: "interactive | auxiliary | background (aliases: primary, aux, bg)"
                        qos_priority: "0-100; class inferred when qos_class omitted (>=70 interactive)"
                        fulfillment: "complete | benchmark — no-degradation / exclusive speed (aliases: guarantee, reliable / bench, speed, exclusive)"
                        session_group: "harness id for shared cache branch (alias: harness)"
                        session_parent: "parent thread prompt_cache_key — wait_parent + Radix prefer"
                        project_id: "client harness id (alias: client_id, project)"
                        project_name: "human label for zerollama ps (alias: client_name)"
                        cache_scope: "auto | thread | shared"
                        cache_level: "auto | gpu | dram | disk — KV tier (auto=heuristics)"
                        cache_reset: "true — force miss under same prompt_cache_key this request"
                      legacy: ["mlx_session_class", "mlx_session_parent", "fulfill_mode", "priority_mode"]
                    openai:
                      extra_body: ["zerollama", "options", "prompt_cache_key", "timeout", "keep_alive", "think"]
                    routes:
                      text: "/api/generate, /api/chat, /v1/chat/completions, /v1/chat/completions/batch"
                      vision: "/api/chat, /v1/chat/completions (images in messages)"
                      video_understanding: "/api/chat, /v1/chat/completions (videos in messages)"
                      image_generation: "/api/generate (image models), /v1/images/generations, /v1/images/edits"
                      video_generation: "POST /v1/videos"
                      cache_pin: "POST /api/cache/pin, DELETE /api/cache/pin/{id}"
                    defaults:
                      image_generation: "background"
                      video_generation: "background"
                      vision: "auxiliary (stream) / background (non-stream)"
                      video_understanding: "auxiliary (stream) / background (non-stream)"

