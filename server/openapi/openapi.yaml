  /v1/chat/completions/batch:
    post:
      tags: [OpenAI]
      summary: Batch chat completions (same model)
      description: >
        Fan-out text chat via Python generate_batch (M15e). Why not Go sched:
        pending_queue is model-load only; decode batching already lives in the
        runtime. Constraints: same model for all items; max 8; no tools/vision/think;
        stream must be false. Requires Python runtime path
        (modality_backends.inference or ZEROLLAMA_RUNTIME).
      operationId: chatCompletionsBatchV1
      x-codeSamples:
        - lang: bash
          source: |
            curl http://localhost:11434/v1/chat/completions/batch \
              -H 'content-type: application/json' \
              -d '{"model":"llama3.2","requests":[{"messages":[{"role":"user","content":"a"}]},{"messages":[{"role":"user","content":"b"}]}]}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionsBatchRequest"
      responses:
        "200":
          description: >
            Wrapper object (not a bare array). `completions[i]` matches
            `requests[i]`. Mixed-model fan-out is a client concern — group by
            model and call this endpoint once per group.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatCompletionsBatchResponse"
              example:
                object: chat.completion.batch
                model: llama3.2
                count: 2
                completions:
                  - id: chatcmpl-example0
                    object: chat.completion
                    created: 1720000000
                    model: llama3.2
                    system_fingerprint: fp_zerollama_runtime
                    choices:
                      - index: 0
                        message: { role: assistant, content: "a" }
                        finish_reason: stop
                    usage: { prompt_tokens: 0, completion_tokens: 0, total_tokens: 0 }
                  - id: chatcmpl-example1
                    object: chat.completion
                    created: 1720000000
                    model: llama3.2
                    system_fingerprint: fp_zerollama_runtime
                    choices:
                      - index: 0
                        message: { role: assistant, content: "b" }
                        finish_reason: stop
                    usage: { prompt_tokens: 0, completion_tokens: 0, total_tokens: 0 }
        "400":
          description: Invalid batch (mixed models, tools/vision/think, stream, size)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InferenceError"
